name: Auto-Clip Top Game Streams

# Daily at 4:00 PM US Eastern (New York), DST-safe: GitHub cron is UTC, so both
# 20:00 UTC (summer, EDT) and 21:00 UTC (winter, EST) are scheduled and the
# time guard lets only the one that is really 4 PM in New York through.
# "Run workflow" (Actions tab, or the badge in the README) runs it any time.
on:
  schedule:
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      game:
        description: 'Game: gta6, or any name (valorant, minecraft, fortnite...)'
        default: 'gta6'
      count:
        description: 'How many new streams/videos to clip'
        default: '2'
      top:
        description: 'Shorts per stream/video'
        default: '3'
      min_views:
        description: 'Skip anything with fewer views (creators in streamers.txt are always allowed)'
        default: '1000'
      list_only:
        description: 'Only list what it would pick (no clipping)'
        type: boolean
        default: false
      upload_to_youtube:
        description: 'Upload the best Short to YouTube (Candle Gate still protects the channel)'
        type: boolean
        default: false
      force_upload:
        description: 'Skip the Candle Gate protection layers (not recommended)'
        type: boolean
        default: false
      privacy:
        description: 'YouTube privacy'
        type: choice
        default: public
        options: [public, unlisted, private]

concurrency:
  group: auto-clip
  cancel-in-progress: false

jobs:
  preflight:
    name: 🕓 4 PM ET guard + 🕯️ 24h spacing pre-flight (Layer 0)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4

      - name: Is it 4 PM in New York?
        id: clock
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          OFF=$(TZ=America/New_York date +%z)
          [ "$OFF" = "-0400" ] && WANT='0 20 * * *' || WANT='0 21 * * *'
          echo "New York offset $OFF, this trigger: '${{ github.event.schedule }}', 4 PM trigger: '$WANT'"
          if [ "${{ github.event.schedule }}" = "$WANT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "Not the 4 PM ET trigger today, skipping."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: 24-hour upload spacing (skip the whole pipeline unless due)
        id: gate
        env:
          # manual "Run workflow" clicks always proceed; the upload step's Candle Gate still protects uploads
          PREFLIGHT_BYPASS: ${{ github.event_name != 'schedule' }}
        run: |
          if [ "${{ steps.clock.outputs.ok }}" != "true" ]; then echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 preflight_gate.py

  auto-clip:
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write   # saves state/processed.json, upload_history.json, candle_gate_state.json
    env:
      GAME: ${{ inputs.game || vars.AUTO_GAME || 'gta6' }}
      COUNT: ${{ inputs.count || '2' }}
      TOP: ${{ inputs.top || '3' }}
      MIN_VIEWS: ${{ inputs.min_views || '1000' }}
      # scheduled runs upload only if the repo variable AUTO_UPLOAD is true
      DO_UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload_to_youtube) || (github.event_name == 'schedule' && vars.AUTO_UPLOAD == 'true') }}
      PRIVACY: ${{ inputs.privacy || vars.AUTO_PRIVACY || 'public' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg + Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -U yt-dlp yt-dlp-ejs bgutil-ytdlp-pot-provider
          pip install -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: 🛡️ Generate YouTube PO Token via Node.js
        id: pot_gen
        run: |
          set -uo pipefail
          echo "📦 Installing youtube-po-token-generator..."
          npm install -g youtube-po-token-generator 2>/dev/null || true

          # Generate fresh PO token + visitor_data via headless Node.js
          POT_JSON=$(timeout 30 node -e "
            const { generate } = require('youtube-po-token-generator');
            generate().then(r => { console.log(JSON.stringify(r)); }).catch(e => { console.log('{}'); });
          " 2>/dev/null || echo '{}')

          PO_TOKEN=$(echo "$POT_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('poToken',''))" 2>/dev/null || echo "")
          VISITOR_DATA=$(echo "$POT_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('visitorData',''))" 2>/dev/null || echo "")

          if [ -n "$PO_TOKEN" ] && [ -n "$VISITOR_DATA" ]; then
            echo "✅ PO Token generated successfully (len=${#PO_TOKEN})"
            echo "po_token=$PO_TOKEN" >> "$GITHUB_OUTPUT"
            echo "visitor_data=$VISITOR_DATA" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ PO Token generation failed — starting bgutil Docker fallback"
            echo "po_token=" >> "$GITHUB_OUTPUT"
            echo "visitor_data=" >> "$GITHUB_OUTPUT"
            docker run -d --name bgutil-provider --restart always -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider 2>/dev/null || true
            for i in {1..10}; do
              curl -s http://127.0.0.1:4416/ping 2>/dev/null && echo "✅ bgutil Docker ready on :4416" && break
              sleep 1
            done
            pip install -U bgutil-ytdlp-pot-provider 2>/dev/null || true
          fi

      - name: YouTube cookies (from repo secret)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "${YOUTUBE_COOKIES:-}" ]; then
            python3 - <<'PY'
          import base64, os
          raw = os.environ["YOUTUBE_COOKIES"].strip()
          text = raw if ("# Netscape" in raw or "\t" in raw) else base64.b64decode(raw).decode("utf-8")
          open("youtube_cookies.txt", "w", encoding="utf-8").write(text + "\n")
          PY
            echo "🍪 cookies ready"
          else
            echo "No YOUTUBE_COOKIES secret: YouTube may ask to sign in"
          fi

      - name: Download TwitchDownloaderCLI
        run: |
          URL=$(curl -s https://api.github.com/repos/lay295/TwitchDownloader/releases/latest | grep -o 'https://[^"]*CLI[^"]*Linux-x64.zip' | head -n 1)
          [ -z "$URL" ] && URL="https://github.com/lay295/TwitchDownloader/releases/download/1.55.2/TwitchDownloaderCLI-1.55.2-Linux-x64.zip"
          curl -sL -o tdl.zip "$URL" && unzip -o -q tdl.zip && chmod +x TwitchDownloaderCLI || echo "TwitchDownloader unavailable"

      - name: Find top streams + make Shorts
        env:
          YOUTUBE_PROXY: ${{ secrets.YOUTUBE_PROXY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YT_PO_TOKEN: ${{ steps.pot_gen.outputs.po_token }}
          YT_VISITOR_DATA: ${{ steps.pot_gen.outputs.visitor_data }}
        run: |
          ARGS=(--game "$GAME" --count "$COUNT" --top "$TOP" --min-views "$MIN_VIEWS" --tdl ./TwitchDownloaderCLI --out clips)
          [ "${{ inputs.list_only }}" = "true" ] && ARGS+=(--list)
          python3 auto_clips.py "${ARGS[@]}" || echo "No Shorts this time"
          rm -f youtube_cookies.txt
          ls -lhR clips/ 2>/dev/null | head -50

      - name: Upload Shorts as artifact
        if: ${{ hashFiles('clips/**/*.mp4') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: auto-shorts
          path: |
            clips/**/*.mp4
            clips/posts.json
            clips/**/moments.json
          retention-days: 7

      - name: Publish best Short (Candle Gate protected)
        if: ${{ env.DO_UPLOAD == 'true' && hashFiles('clips/posts.json') != '' && !inputs.list_only }}
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          EXTRA=()
          [ "${{ inputs.force_upload }}" = "true" ] && EXTRA+=(--force)
          RC=0
          python3 youtube_uploader.py --posts clips/posts.json --max 1 --privacy "$PRIVACY" "${EXTRA[@]}" || RC=$?
          if [ "$RC" -eq 2 ]; then echo "⏸️ Upload deferred by the Candle Gate (protecting the last Short)."
          elif [ "$RC" -ne 0 ]; then exit $RC; fi

      - name: Save state (clipped videos, upload history, candle gate)
        if: ${{ always() && !inputs.list_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/processed.json upload_history.json candle_gate_state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No state changes"; exit 0; fi
          git commit -q -m "🤖 auto-clip state [skip ci]"
          git checkout -- . 2>/dev/null || true
          git pull --rebase -q && git push -q || echo "state push failed (will re-check next run)"
