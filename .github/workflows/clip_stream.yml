name: Clip Stream to Shorts (Cloud Runner)

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: 'Twitch VOD or YouTube video / past live stream link ("demo" = test with fake footage, never uploaded)'
        required: false
        default: 'demo'
        type: string
      game:
        description: 'Game tuning for reactions, hooks and hashtags'
        required: false
        default: 'gta6'
        type: choice
        options:
          - gta6
          - none
      emotes:
        description: 'Count only reaction messages (LMAO, KEKW, 💀, WTF, WASTED...)'
        required: false
        default: true
        type: boolean
      no_chat:
        description: 'No chat replay (gameplay upload / trailer): find moments from loudness spikes'
        required: false
        default: false
        type: boolean
      min_score:
        description: 'Minimum spike multiplier (e.g. 2.0 or 4.0)'
        required: false
        default: '2.0'
        type: string
      layout:
        description: '9:16 layout: auto (cam on top if a webcam is found, else zoomed gameplay)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - stack
          - gameplay
          - blur
          - crop
      cam_pos:
        description: 'Webcam position (auto = detect)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - bottom-left
          - top-left
          - bottom-right
          - top-right
      top:
        description: 'Number of clips'
        required: false
        default: '3'
        type: string
      before:
        description: 'Seconds before the spike'
        required: false
        default: '20'
        type: string
      after:
        description: 'Seconds after the spike'
        required: false
        default: '10'
        type: string
      captions:
        description: 'Word-by-word captions (Whisper)'
        required: false
        default: true
        type: boolean
      lang:
        description: 'Spoken language (en, hi...). Empty = auto-detect'
        required: false
        default: ''
        type: string
      hook_text:
        description: 'Fixed hook for every clip. Empty = picked per clip from what chat said'
        required: false
        default: ''
        type: string
      credit:
        description: 'Streamer name for on-screen credit (empty = from the video)'
        required: false
        default: ''
        type: string
      upload_to_youtube:
        description: 'Publish to YouTube Shorts (grandtheftclipper). Never happens in demo mode'
        required: false
        default: false
        type: boolean
      privacy:
        description: 'YouTube privacy for uploads'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private

jobs:
  find-and-cut-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      IS_DEMO: ${{ inputs.vod_url == 'demo' || inputs.vod_url == '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg + Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -U yt-dlp yt-dlp-ejs bgutil-ytdlp-pot-provider
          pip install -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: 🛡️ Generate YouTube PO Token via Node.js
        id: pot_gen
        run: |
          set -uo pipefail
          echo "📦 Installing youtube-po-token-generator..."
          npm install -g youtube-po-token-generator 2>/dev/null || true

          # Generate fresh PO token + visitor_data via headless Node.js
          POT_JSON=$(timeout 30 node -e "
            const { generate } = require('youtube-po-token-generator');
            generate().then(r => { console.log(JSON.stringify(r)); }).catch(e => { console.log('{}'); });
          " 2>/dev/null || echo '{}')

          PO_TOKEN=$(echo "$POT_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('poToken',''))" 2>/dev/null || echo "")
          VISITOR_DATA=$(echo "$POT_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('visitorData',''))" 2>/dev/null || echo "")

          if [ -n "$PO_TOKEN" ] && [ -n "$VISITOR_DATA" ]; then
            echo "✅ PO Token generated successfully (len=${#PO_TOKEN})"
            echo "po_token=$PO_TOKEN" >> "$GITHUB_OUTPUT"
            echo "visitor_data=$VISITOR_DATA" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ PO Token generation failed — starting bgutil Docker fallback"
            echo "po_token=" >> "$GITHUB_OUTPUT"
            echo "visitor_data=" >> "$GITHUB_OUTPUT"
            docker run -d --name bgutil-provider --restart always -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider 2>/dev/null || true
            for i in {1..10}; do
              curl -s http://127.0.0.1:4416/ping 2>/dev/null && echo "✅ bgutil Docker ready on :4416" && break
              sleep 1
            done
            pip install -U bgutil-ytdlp-pot-provider 2>/dev/null || true
          fi

      - name: YouTube cookies & proxy (from repo secrets)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "${YOUTUBE_COOKIES:-}" ]; then
            python3 - <<'PY'
          import base64, os
          raw = os.environ["YOUTUBE_COOKIES"].strip()
          text = raw if ("# Netscape" in raw or "\t" in raw) else base64.b64decode(raw).decode("utf-8")
          open("youtube_cookies.txt", "w", encoding="utf-8").write(text + "\n")
          PY
            echo "🍪 youtube_cookies.txt ready"
          else
            echo "No YOUTUBE_COOKIES secret: YouTube may ask to sign in"
          fi

      - name: Download TwitchDownloaderCLI (Twitch links only)
        if: ${{ env.IS_DEMO != 'true' && contains(inputs.vod_url, 'twitch') }}
        run: |
          URL=$(curl -s https://api.github.com/repos/lay295/TwitchDownloader/releases/latest | grep -o 'https://[^"]*CLI[^"]*Linux-x64.zip' | head -n 1)
          [ -z "$URL" ] && URL="https://github.com/lay295/TwitchDownloader/releases/download/1.55.2/TwitchDownloaderCLI-1.55.2-Linux-x64.zip"
          curl -sL -o tdl.zip "$URL" && unzip -o -q tdl.zip && chmod +x TwitchDownloaderCLI

      - name: Make the Shorts
        env:
          YOUTUBE_PROXY: ${{ secrets.YOUTUBE_PROXY }}
          YT_PO_TOKEN: ${{ steps.pot_gen.outputs.po_token }}
          YT_VISITOR_DATA: ${{ steps.pot_gen.outputs.visitor_data }}
          VOD_URL: ${{ inputs.vod_url }}
          HOOK: ${{ inputs.hook_text }}
          CREDIT: ${{ inputs.credit }}
        run: |
          ARGS=(--game "${{ inputs.game }}" --min-score "${{ inputs.min_score }}" --top "${{ inputs.top }}"
                --before "${{ inputs.before }}" --after "${{ inputs.after }}" --layout "${{ inputs.layout }}"
                --cam "${{ inputs.cam_pos }}" --out clips)
          [ "${{ inputs.emotes }}" = "true" ] && ARGS+=(--emotes)
          [ "${{ inputs.captions }}" = "true" ] || ARGS+=(--captions off)
          [ -n "${{ inputs.lang }}" ] && ARGS+=(--lang "${{ inputs.lang }}")
          [ -n "$HOOK" ] && ARGS+=(--hook "$HOOK")
          [ -n "$CREDIT" ] && ARGS+=(--credit "$CREDIT")
          [ -f TwitchDownloaderCLI ] && ARGS+=(--tdl ./TwitchDownloaderCLI)

          if [ "$IS_DEMO" = "true" ]; then
            echo "🎮 Demo mode: fake 2h stream, nothing gets uploaded"
            ffmpeg -y -loglevel error -f lavfi -i "testsrc2=size=854x480:rate=5:duration=7200" \
              -f lavfi -i "sine=frequency=440:beep_factor=4:sample_rate=44100:duration=7200" \
              -c:v libx264 -preset ultrafast -crf 30 -pix_fmt yuv420p -c:a aac -b:a 64k demo_stream.mp4
            python3 chat_clips.py demo_chat.json --video demo_stream.mp4 --whisper-model tiny "${ARGS[@]}"
          elif [ "${{ inputs.no_chat }}" = "true" ]; then
            python3 chat_clips.py --url "$VOD_URL" --no-chat "${ARGS[@]}"
          else
            python3 chat_clips.py --url "$VOD_URL" "${ARGS[@]}"
          fi
          rm -f youtube_cookies.txt
          ls -lh clips/

      - name: Upload Shorts as artifact
        uses: actions/upload-artifact@v4
        with:
          name: shorts-9x16
          path: |
            clips/*.mp4
            clips/posts.json
            clips/moments.json
          retention-days: 7

      - name: Publish to YouTube Shorts (grandtheftclipper)
        if: ${{ inputs.upload_to_youtube && env.IS_DEMO != 'true' }}
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: python3 youtube_uploader.py --posts clips/posts.json --privacy "${{ inputs.privacy }}"
